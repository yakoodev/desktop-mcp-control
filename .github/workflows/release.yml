name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-artifact:
    name: Build Linux artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          if [ -z "$version" ]; then
            echo "Version is missing in Directory.Build.props" >&2
            exit 1
          fi

          linux_portable="desktop-mcp-control-v${version}-linux-x64-portable.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "linuxPortable=$linux_portable" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore DesktopMcp.slnx

      - name: Build
        run: dotnet build DesktopMcp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopMcp.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Linux x64
        run: |
          dotnet publish DesktopMcp.App/DesktopMcp.App.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:CopyDebugSymbolFilesFromPackages=false \
            --output publish/desktop-mcp-control-linux

      - name: Pack Linux artifact
        run: |
          mkdir -p dist
          tar -C publish/desktop-mcp-control-linux -czf "dist/${{ steps.version.outputs.linuxPortable }}" .
          sha256sum "dist/${{ steps.version.outputs.linuxPortable }}" > dist/SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            dist/${{ steps.version.outputs.linuxPortable }}
            dist/SHA256SUMS-linux.txt

  release:
    name: Build, package, and release
    runs-on: windows-latest
    needs:
      - linux-artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is missing in Directory.Build.props"
          }

          $tag = "v$version"
          $portable = "desktop-mcp-control-v$version-win-x64-portable.exe"
          $setup = "desktop-mcp-control-v$version-win-x64-setup.exe"
          $linuxPortable = "desktop-mcp-control-v$version-linux-x64-portable.tar.gz"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "linuxPortable=$linuxPortable" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DesktopMcp.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build DesktopMcp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopMcp.slnx --configuration Release --no-build --verbosity normal

      - name: Restore WiX extensions
        run: dotnet wix extension add WixToolset.Bal.wixext/6.0.2

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DesktopMcp.App/DesktopMcp.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:CopyDebugSymbolFilesFromPackages=false `
            --output publish/desktop-mcp-control

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: dist

      - name: Build release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path "publish/desktop-mcp-control" -Recurse -Filter "*.pdb" | Remove-Item -Force

          $portablePath = Join-Path "dist" "${{ steps.version.outputs.portable }}"
          Copy-Item "publish/desktop-mcp-control/DesktopMcp.App.exe" $portablePath -Force

          $msiPath = Join-Path "dist" "desktop-mcp-control-v${{ steps.version.outputs.version }}-win-x64.msi"
          dotnet wix build installer/Product.wxs `
            -d Version=${{ steps.version.outputs.version }} `
            -d PublishDir=publish/desktop-mcp-control `
            -d IconPath=DesktopMcp.App/Assets/icon.ico `
            -arch x64 `
            -o $msiPath `
            -pdbtype none

          $balExtension = Resolve-Path ".wix/extensions/WixToolset.Bal.wixext/6.0.2/wixext6/WixToolset.BootstrapperApplications.wixext.dll"
          $setupPath = Join-Path "dist" "${{ steps.version.outputs.setup }}"
          dotnet wix build installer/Bundle.wxs `
            -d Version=${{ steps.version.outputs.version }} `
            -d MsiPath=$msiPath `
            -ext $balExtension `
            -arch x64 `
            -o $setupPath `
            -pdbtype none

          Remove-Item $msiPath -Force

          $linuxPortablePath = Join-Path "dist" "${{ steps.version.outputs.linuxPortable }}"
          if (-not (Test-Path $linuxPortablePath)) {
            throw "Linux artifact not found: $linuxPortablePath"
          }

          $hashes = @(
            Get-FileHash $portablePath -Algorithm SHA256
            Get-FileHash $setupPath -Algorithm SHA256
            Get-FileHash $linuxPortablePath -Algorithm SHA256
          )
          $hashes | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Set-Content "dist/SHA256SUMS.txt"

      - name: Write release notes
        shell: pwsh
        run: |
          @(
            "# Desktop MCP Control v${{ steps.version.outputs.version }}"
            ""
            "Desktop MCP Control release for Windows and Linux x64."
            ""
            "Included artifacts:"
            "- ${{ steps.version.outputs.portable }} - Windows portable self-contained executable"
            "- ${{ steps.version.outputs.setup }} - Windows WiX setup executable"
            "- ${{ steps.version.outputs.linuxPortable }} - Linux x64 portable archive"
            "- SHA256SUMS.txt - SHA256 checksums"
            ""
            "Default MCP endpoint: http://127.0.0.1:45454/mcp"
          ) | Set-Content RELEASE_NOTES.md

      - name: Move release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: Desktop MCP Control v${{ steps.version.outputs.version }}
          bodyFile: RELEASE_NOTES.md
          artifacts: dist/${{ steps.version.outputs.portable }},dist/${{ steps.version.outputs.setup }},dist/${{ steps.version.outputs.linuxPortable }},dist/SHA256SUMS.txt
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
